<style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: #1e293b;
            --sidebar-bg: #0f172a;
            --accent-blue: #38bdf8;
            --accent-green: #34d399;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --sidebar-width: 260px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.7;
            display: flex;
        }

        /* --- LEFT SIDEBAR NAVIGATION --- */
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--sidebar-bg);
            position: fixed;
            top: 0;
            left: 0;
            border-right: 1px solid var(--border-color);
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 100;
        }

        .profile-info h1 {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .profile-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 40px;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .nav-item {
            color: var(--text-muted);
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-item:hover {
            color: var(--accent-blue);
            background: rgba(56, 189, 248, 0.05);
            transform: translateX(4px);
        }

        .sidebar-footer {
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sidebar-footer a {
            color: var(--text-main);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .sidebar-footer a:hover {
            color: var(--accent-blue);
        }

        /* --- MAIN CONTENT WINDOW --- */
        .main-content {
            margin-left: var(--sidebar-width);
            flex-grow: 1;
            padding: 40px 50px;
            max-width: 1150px;
        }

        /* --- HOME SECTION HERO LAYOUT --- */
        .home-hero {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 40px;
            align-items: center;
            min-height: calc(100vh - 80px);
            padding: 0;
            background: none;
            border: none;
            box-shadow: none;
        }

        .hero-left h1 {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 15px;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-left h1 span {
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-left h2 {
            font-size: 1.5rem;
            color: var(--accent-blue);
            font-weight: 500;
            margin-bottom: 20px;
            border: none;
            padding: 0;
        }

        .hero-left p {
            font-size: 1.15rem;
            color: var(--text-muted);
            margin-bottom: 35px;
            max-width: 550px;
        }

        .hero-btn {
            display: inline-block;
            background: linear-gradient(135deg, #38bdf8 0%, #4f46e5 100%);
            color: #0f172a;
            font-weight: 600;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 50px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.25);
        }

        .hero-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(56, 189, 248, 0.4);
            color: #0f172a;
        }

        .hero-right {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* FIXED STRICTOR CIRCLE MASK FOR PHOTO2.JPG */
        .profile-img-container {
            width: 300px;
            height: 300px;
            border-radius: 50% !important; /* Forces perfect geometric circular borders */
            overflow: hidden !important;   /* Cuts off any image edges stretching out */
            border: 4px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.15), 0 20px 40px rgba(0,0,0,0.4);
            transition: transform 0.3s ease;
            display: block;
        }

        .profile-img-container:hover {
            transform: scale(1.03);
            border-color: var(--accent-blue);
        }

        .profile-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover !important;        /* Prevents squishing or horizontal stretching */
            object-position: center center;      /* Keeps your facial features dead center */
            display: block;
        }

        /* --- STANDARD SECTION STYLING --- */
        section {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid var(--border-color);
            padding: 45px;
            border-radius: 24px;
            margin-bottom: 60px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            
            /* Entry Animations */
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* Section Stagger delays */
        section:nth-child(1) { animation-delay: 0.1s; }
        section:nth-child(2) { animation-delay: 0.2s; }
        section:nth-child(3) { animation-delay: 0.3s; }
        section:nth-child(4) { animation-delay: 0.4s; }
        section:nth-child(5) { animation-delay: 0.5s; }
        section:nth-child(6) { animation-delay: 0.6s; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        section h2 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 28px;
            color: #f1f5f9;
            border-left: 4px solid var(--accent-blue);
            padding-left: 12px;
        }

        .about-text {
            font-size: 1.15rem;
            color: #cbd5e1;
        }

        /* Card Layout Systems */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(56, 189, 248, 0.3);
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
        }

        .card h3 {
            font-size: 1.25rem;
            color: #f8fafc;
            margin-bottom: 4px;
        }

        .card .subtitle {
            color: var(--accent-blue);
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 4px;
        }

        .card .timeline {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .card ul {
            list-style: none;
            margin-bottom: 20px;
        }

        .card ul li {
            position: relative;
            padding-left: 18px;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: #cbd5e1;
        }

        .card ul li::before {
            content: "▹";
            position: absolute;
            left: 0;
            color: var(--accent-blue);
        }

        /* Skill Tag Pill Config */
        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: auto;
        }

        .tag-badge {
            background: rgba(56, 189, 248, 0.08);
            color: var(--accent-blue);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid rgba(56, 189, 248, 0.12);
        }

        .toolkit-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .toolkit-item {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 14px;
        }

        .toolkit-item h4 {
            color: var(--accent-blue);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .toolkit-item p {
            font-size: 1rem;
            color: #cbd5e1;
        }

        /* Layout Responsiveness adjustments */
        @media (max-width: 950px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                padding: 30px 20px;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }
            .nav-menu {
                flex-direction: row;
                flex-wrap: wrap;
                margin-top: 20px;
            }
            .sidebar-footer {
                display: none;
            }
            .main-content {
                margin-left: 0;
                padding: 30px 20px;
            }
            .home-hero {
                grid-template-columns: 1fr;
                text-align: center;
                min-height: auto;
                padding: 40px 0;
                display: flex;
                flex-direction: column-reverse;
                gap: 30px;
            }
            .hero-left h1 {
                font-size: 2.6rem;
            }
            .profile-img-container {
                width: 240px;
                height: 240px;
            }
        }
    </style>
